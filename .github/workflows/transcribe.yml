name: Temporary lecture transcription

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve and download public Yandex Disk file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests
          public='https://disk.yandex.ru/i/pH92BVR1Qa5rmQ'
          api='https://cloud-api.yandex.net/v1/disk/public/resources/download'
          r=requests.get(api, params={'public_key':public}, timeout=60)
          r.raise_for_status()
          href=r.json()['href']
          print('Resolved Yandex download URL')
          with requests.get(href, stream=True, timeout=180) as f:
              f.raise_for_status()
              with open('lesson.mov','wb') as out:
                  for chunk in f.iter_content(4*1024*1024):
                      if chunk: out.write(chunk)
          PY
          ls -lh lesson.mov

      - name: Install ffmpeg and extract normalized speech audio
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -loglevel error -y -i lesson.mov -vn -ac 1 -ar 16000 -c:a pcm_s16le lesson.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 lesson.wav
          ls -lh lesson.wav
          rm -f lesson.mov

      - name: Install faster-whisper
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet faster-whisper

      - name: Transcribe with multilingual Whisper small
        shell: bash
        run: |
          set -euo pipefail
          cat > transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path

          model = WhisperModel('small', device='cpu', compute_type='int8', cpu_threads=4)
          segments, info = model.transcribe(
              'lesson.wav',
              language='ru',
              task='transcribe',
              beam_size=5,
              vad_filter=True,
              vad_parameters=dict(min_silence_duration_ms=400),
              condition_on_previous_text=True,
              word_timestamps=False,
          )

          def ts(x):
              x = int(round(x))
              return f'{x//3600:02d}:{(x%3600)//60:02d}:{x%60:02d}'

          lines=[]
          for s in segments:
              text=s.text.strip()
              if text:
                  line=f'[{ts(s.start)}–{ts(s.end)}] {text}'
                  lines.append(line)
                  print(line, flush=True)

          Path('transcript.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('DETECTED:', info.language, info.language_probability, flush=True)
          print('SEGMENTS:', len(lines), 'CHARS:', sum(map(len, lines)), flush=True)
          PY
          python3 transcribe.py

      - name: Verify transcript
        shell: bash
        run: |
          set -euo pipefail
          test -s transcript.txt
          wc -l -c transcript.txt
          echo '--- TRANSCRIPT BEGIN ---'
          cat transcript.txt
          echo '--- TRANSCRIPT END ---'

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: lecture-transcript
          path: transcript.txt
          retention-days: 1
